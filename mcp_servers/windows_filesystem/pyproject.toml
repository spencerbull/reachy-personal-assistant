[project]
name = "windows-filesystem-mcp"
version = "0.1.0"
description = "MCP server for Windows filesystem operations - file organization, management, and semantic understanding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
windows-fs-mcp = "server:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["."]
