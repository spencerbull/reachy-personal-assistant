version: '3.8'

services:
  agent-llm:
    image: nvcr.io/nvidia/vllm:25.12-py3
    container_name: agent-llm
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8000"
    # Agent: Qwen3 30B NVFP4
    command: vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 --port 8000 --host 0.0.0.0 --gpu-memory-utilization 0.6 --max-model-len 128000 --trust-remote-code --max-num-seqs 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://0.0.0.0:8000/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
  routing-llm:
    image: nvcr.io/nvidia/vllm:25.12-py3
    container_name: routing-llm
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8003:8000"
    # Router: Phi-3 (~7GB weights). 20% alloc = ~25GB total.
    command: vllm serve microsoft/Phi-3-mini-128k-instruct --port 8000 --host 0.0.0.0 --gpu-memory-utilization 0.1 --max-model-len 4096 --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://0.0.0.0:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      agent-llm:
        condition: service_healthy
